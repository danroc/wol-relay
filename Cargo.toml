[package]
name = "wol-relay"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
if-addrs = "0.15"
libc = "0.2"
log = { version = "0.4", features = ["kv_serde"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"

[profile.release]
strip = true
lto = true
