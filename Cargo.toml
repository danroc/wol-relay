[package]
name = "wol-relay"
version = "0.1.13"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
if-addrs = "0.13"
libc = "0.2"
log = { version = "0.4", features = ["kv_serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[profile.release]
strip = true
lto = true
